<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Educarama - Nuevo Protagonista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="header-inst"></div>
    <div class="sidebar"></div>

    <div class="main-content-wrapper">
        <div class="container contenedor-principal my-4 p-4">
            <div class="barra-superior-inst mb-4">
                <h1 class="fw-bold mb-1">Nuevo protagonista</h1>
                <p class="mb-0">Cargá un protagonista y asocialo a una rama.</p>
            </div>
            
            <div id="alerta-contenedor"></div>
            <form id="form-alta-protagonista" class="tarjeta-blanca-borde p-4">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre del protagonista</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Rama</label>
                    <select id="id_rama" name="id_rama" class="form-select" required>
                        <option value="">Cargando ramas...</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="boton-primario px-4 py-2 fw-bold">
                        <i class="bi bi-save me-2"></i>Guardar protagonista
                    </button>
                    <a href="protagonistas.html" class="btn btn-secondary px-4 py-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <div class="footer-inst">
        <p class="m-0 texto-blanco small">© 2026 Plataforma Educarama - Scouts de Argentina</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/componentes.js"></script>
</body>
</html>
