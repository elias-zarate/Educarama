<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educarama - Perfil de Protagonista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body id="body-rama">
    <div class="header-inst"></div>
    <div class="sidebar"></div>
    <div class="main-content-wrapper">
        <div class="container contenedor-principal my-4 p-4">

             <div id="alerta-contenedor"></div>

             <!-- ENCABEZADO DEL PERFIL -->
             <div class="row mb-3 align-items-center barra-superior-inst mx-0">
                 <div class="col-8">
                     <h1 class="h3 fw-bold mb-0" id="nombre-protagonista">Cargando...</h1>
                     <p class="mb-0 fw-bold" id="rama-protagonista">Cargando...</p>
                 </div>
             </div>

             <!-- DATOS Y FAMILIA -->
             <div class="row mb-4 align-items-stretch">
                 <div class="col-md-7 mb-3 mb-md-0">
                     <div class="tarjeta-blanca-borde p-4 h-100" id="datos-protagonista">
                         <h2 class="h5 fw-bold mb-3 texto-violeta">Datos Personales</h2>
                         <div id="contenido-datos">
                             <p class="text-muted">Cargando datos...</p>
                         </div>
                     </div>
                 </div>
                 <div class="col-md-5 mb-3 mb-md-0">
                     <div class="tarjeta-blanca-borde p-4 h-100">
                         <h2 class="h5 fw-bold mb-3 texto-violeta">Grupo Familiar</h2>
                         <div id="listaFamiliares">
                             <p class="text-muted">Cargando familiares...</p>
                         </div>
                     </div>
                 </div>
             </div>

             <!-- PROGRESIÓN Y COMPETENCIAS -->
             <div class="row mb-4">
                 <div class="col-12">
                     <div class="tarjeta-blanca-borde p-4">
                         <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                             <h2 class="h4 fw-bold mb-0 texto-violeta">Progresión Personal</h2>
                             <!-- Botón para otorgar insignia -->
                             <button type="button" class="boton-primario px-3 py-2 fw-bold" data-bs-toggle="modal" data-bs-target="#modalOtorgarInsignia">
                                 <i class="bi bi-award-fill me-2"></i>Otorgar Insignia
                             </button>
                         </div>
                         <div class="row g-4">
                             <!-- Lista En Desarrollo -->
                             <div class="col-md-6">
                                 <h3 class="h6 fw-bold text-warning mb-3"><i class="bi bi-clock-fill me-2"></i>En Desarrollo</h3>
                                 <div id="lista-desarrollo" class="list-group">
                                     <p class="text-muted small">Cargando competencias...</p>
                                 </div>
                             </div>
                             <!-- Lista Completadas -->
                             <div class="col-md-6">
                                 <h3 class="h6 fw-bold text-success mb-3"><i class="bi bi-check-circle-fill me-2"></i>Completadas</h3>
                                 <div id="lista-completadas" class="list-group">
                                     <p class="text-muted small">Cargando competencias...</p>
                                 </div>
                             </div>
                         </div>
                     </div>
                 </div>
             </div>

        </div>
    </div>

    <!-- MODAL PARA LA TARJETA DE COMPETENCIA -->
    <div class="modal fade" id="modalCompetencia" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" style="background: transparent; border: none;">
          <div class="modal-body p-0 position-relative" id="contenedor-tarjeta-modal">
             <!-- Acá se inyecta la tarjeta por JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL PARA OTORGAR INSIGNIA -->
    <div class="modal fade" id="modalOtorgarInsignia" tabindex="-1" aria-labelledby="modalOtorgarInsigniaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content tarjeta-blanca-borde">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold texto-violeta" id="modalOtorgarInsigniaLabel"><i class="bi bi-award-fill me-2"></i>Otorgar Insignia</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formOtorgarInsignia">
                        <div class="mb-3">
                            <label for="selectInsignia" class="form-label fw-bold">Seleccionar Insignia</label>
                            <select class="form-select" id="selectInsignia" required>
                                <option value="" disabled selected>Elegí una insignia...</option>
                                <option value="1">Lobo Pata Tierna</option>
                                <option value="2">Lobo Saltador</option>
                                <option value="3">Lobo Rastreador</option>
                                <option value="4">Lobo Cazador</option>
                            </select>
                        </div>
                        <button type="submit" class="boton-primario w-100 py-2 mt-2 fw-bold" id="btnConfirmarInsignia">Confirmar Obtención</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-inst">
        <p class="m-0 texto-blanco small">© 2026 Plataforma Educarama - Scouts de Argentina</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/componentes.js"></script>
    <script src="perfil_protagonista.js"></script>
</body>
</html>
