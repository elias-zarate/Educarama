<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educarama - Perfil de Protagonista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body id="body-rama"> <!-- El JS puede cambiar la clase de la rama -->
    <!-- Header y Sidebar -->
    <div class="main-content-wrapper">
        <div class="container contenedor-principal my-4 p-4">
             <div id="alerta-contenedor"></div>
             <!-- ENCABEZADO DEL PERFIL -->
             <div class="row mb-3 align-items-center barra-superior-inst mx-0">
                 <div class="col-8">
                     <h1 class="h3 fw-bold mb-0" id="nombre-protagonista">Cargando...</h1>
                     <p class="mb-0 fw-bold" id="rama-protagonista">Cargando...</p>
                 </div>
                 <!-- ... Logo ... -->
             </div>
             <!-- INFORMACIÓN BÁSICA -->
             <div class="row mb-4 align-items-stretch">
                 <div class="col-md-12 mb-3 mb-md-0">
                     <div class="tarjeta-blanca-borde p-3 h-100" id="datos-protagonista">
                         <p>Cargando datos...</p>
                     </div>
                 </div>
             </div>
             <!-- SECCIÓN DE PROGRESIÓN y BOTONES -->
        </div>
    </div>
    <!-- Footer -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="perfil_protagonista.js"></script>
</body>
</html>
