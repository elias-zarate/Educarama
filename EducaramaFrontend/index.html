<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educarama - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- HEADER Y SIDEBAR DEBEN ESTAR INCLUIDOS O CARGADOS CON JS -->
    <div class="header-inst">
        <div class="d-flex align-items-center gap-2">
            <h1 class="m-0 fs-4 texto-blanco fw-bold">Educarama</h1>
        </div>
    </div>
    <div class="sidebar">
        <!-- Navegación -->
    </div>

    <div class="main-content-wrapper">
        <div class="container contenedor-principal home-container my-4 p-4">
            <!-- Contenido del Dashboard -->
             <section class="home-welcome">
                 <h2>Bienvenido a Educarama</h2>
                 <p>Panel principal para visualizar avisos, actividades y novedades del grupo scout.</p>
             </section>
             <h3 class="home-section-title">  Avisos importantes</h3>
             <section class="home-alerts" id="contenedor-avisos">
                 <p>Cargando avisos...</p>
             </section>
             <!-- Resto de las secciones (Estadísticas, próximos eventos) -->
        </div>
    </div>
    <!-- FOOTER -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script> <!-- Script para cargar datos del dashboard -->
</body>
</html>
