<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educarama - Unirse a un Grupo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light no-sidebar">
    <!-- BARRA SUPERIOR -->
    <div class="header-inst">
        <div class="d-flex align-items-center gap-2">
            <img class="img-fluid rounded-circle" src="assets/images/Logo1.png" alt="Logo Educarama" style="width: 40px; height: 40px;">
            <h1 class="m-0 fs-4 texto-blanco fw-bold">Educarama</h1>
        </div>
    </div>

    <div class="main-content-wrapper without-sidebar d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 122px);">
        <div class="container" style="max-width: 500px;">
            <div class="tarjeta-blanca-borde p-4 shadow-lg">
                <div class="text-center mb-4">
                    <i class="bi bi-diagram-3-fill text-violeta" style="font-size: 3rem;"></i>
                    <h2 class="fw-bold mt-2 text-violeta">Unite a tu Grupo Scout</h2>
                    <p class="text-muted">Ingresá el código de invitación para vincular tu cuenta a un grupo existente.</p>
                </div>
                
                <div id="mensajeAlerta"></div>

                <form id="formUnirseGrupo">
                    <div class="mb-3">
                        <label for="codigoGrupo" class="form-label fw-bold">Código del Grupo</label>
                        <input type="text" class="form-control form-control-lg text-center fw-bold" id="codigoGrupo" name="codigoGrupo" placeholder="Ej: A1B2C3D4" required style="letter-spacing: 2px;">
                    </div>
                    
                    <div class="mb-4">
                        <label for="idRol" class="form-label fw-bold">Seleccioná tu Rol</label>
                        <select class="form-select form-select-lg" id="idRol" name="idRol" required>
                            <option value="" disabled selected>Elegí una opción...</option>
                            <option value="2">Jefe de Grupo</option>
                            <option value="3">Jefe de Rama</option>
                            <option value="4">Educador</option>
                        </select>
                    </div>

                    <button type="submit" class="boton-primario w-100 py-2 fs-5 fw-bold" id="btnSubmit">
                        Vincular Cuenta
                    </button>
                    <div class="text-center mt-3">
                        <a href="dashboard.html" class="text-secondary text-decoration-none small">Omitir por ahora</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- BARRA INFERIOR -->
    <div class="footer-inst">
        <p class="m-0 texto-blanco small">© 2026 Plataforma Educarama - Scouts de Argentina</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/unirse_grupo.js"></script>
</body>
</html>
