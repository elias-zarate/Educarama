<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Educarama - Avisos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css"> 
</head>
<body>
    <div class="header-inst"></div>
    <div class="sidebar"></div>
    <div class="main-content-wrapper">
        <div class="container contenedor-principal my-4 p-4">
            <div id="alerta-contenedor"></div>
            <div class="barra-superior-inst mb-4">
                <h1 class="fw-bold mb-1" id="titulo-formulario">Gestionar avisos</h1>
                <p class="mb-0">Administrá los avisos que se muestran en la pantalla de inicio.</p>
            </div>
            
            <form id="form-aviso" class="tarjeta-blanca-borde p-4 mb-4">
                <input type="hidden" id="id_aviso" name="id">
                <div class="mb-3">
                    <label class="form-label fw-bold">Título</label>
                    <input type="text" id="titulo" name="titulo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción</label>
                    <textarea id="descripcion" name="descripcion" class="form-control" rows="3" required></textarea>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Fecha inicio</label>
                        <input type="date" id="fecha_inicio" name="fecha_inicio" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Fecha fin</label>
                        <input type="date" id="fecha_fin" name="fecha_fin" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Prioridad</label>
                        <select id="prioridad" name="prioridad" class="form-select" required>
                            <option value="alta">Alta</option>
                            <option value="media" selected>Media</option>
                            <option value="baja">Baja</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="boton-primario px-4 py-2 fw-bold" id="btn-guardar-aviso">
                    <i class="bi bi-save me-2"></i>Guardar aviso
                </button>
                <button type="button" class="btn btn-secondary ms-2 d-none" id="btn-cancelar-edicion">
                    Cancelar edición
                </button>
            </form>

            <div class="tarjeta-blanca-borde p-4">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h2 class="h4 texto-violeta fw-bold mb-0">Avisos cargados</h2>
                    <div class="btn-group" id="filtros-avisos">
                        <button type="button" class="btn btn-outline-primary active" data-filtro="todos">Todos</button>
                        <button type="button" class="btn btn-outline-primary" data-filtro="activos">Activos</button>
                        <button type="button" class="btn btn-outline-primary" data-filtro="inactivos">Inactivos</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Prioridad</th>
                                <th>Inicio</th>
                                <th>Fin</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-avisos">
                            <tr><td colspan="6">Cargando avisos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-inst">
        <p class="m-0 texto-blanco small">© 2026 Plataforma Educarama - Scouts de Argentina</p>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/componentes.js"></script>
    
    <!-- Script actualizado apuntando a la misma carpeta -->
    <script src="gestionar_avisos.js"></script>
</body>
</html>
