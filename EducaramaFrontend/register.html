<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educarama - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="rama-unidad">
    <!-- BARRA SUPERIOR -->
    <div class="header-inst">
        <div class="d-flex align-items-center gap-2">
            <img class="img-fluid rounded-circle" src="../assets/images/Logo1.png" alt="Logo Educarama" style="width: 40px; height: 40px;">
            <h1 class="m-0 fs-4 texto-blanco fw-bold">Educarama</h1>
        </div>
    </div>

    <div class="main-content-wrapper without-sidebar">
        <div class="container contenedor-principal without-sidebar my-4 p-4">
            <div class="row mb-3 align-items-center barra-superior-inst mx-0">
                <div class=" align-items-center">
                    <h1 class="h3 fw-bold mb-0">Registro</h1>
                </div>
            </div>
            <div class="row mb-4 align-items-stretch">
                <div class="col-md-12 mb-3 mb-md-0">
                    <div class="tarjeta-blanca-borde p-3 h-100">
                        <hr class="border-white opacity-25">
                        <div id="mensajeAlerta"></div>
                        <form id="registroForm">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="contrasenia" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="contrasenia" name="password" placeholder="Ingrese su contraseña" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Registrarse</button>
                            <a href="login.html" class="btn btn-secondary ms-2">Volver al login</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BARRA INFERIOR -->
    <div class="footer-inst">
        <p class="m-0 texto-blanco small">© 2026 Plataforma Educarama - Scouts de Argentina</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
