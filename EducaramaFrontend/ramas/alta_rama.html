<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Educarama - Nueva Rama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- BARRA SUPERIOR -->
    <div class="header-inst">
        <div class="d-flex align-items-center gap-2">
            <img class="img-fluid rounded-circle" src="../assets/images/Logo1.png" alt="Logo Educarama" style="width: 40px; height: 40px;">
            <h1 class="m-0 fs-4 texto-blanco fw-bold">Educarama</h1>
        </div>
    </div>

    <!-- MENÚ LATERAL (Igual al anterior, pero activo en "Agregar rama") -->
    <div class="sidebar">
        <nav class="nav flex-column">
            <a class="nav-link" href="../../public/index.html"><span class="icon"><i class="bi bi-grid"></i></span><span class="description">Inicio</span></a>
            
            <a class="nav-link" href="#" data-bs-toggle="collapse" data-bs-target="#submenu-protagonistas"><span class="icon"><i class="bi bi-people"></i></span><span class="description">Protagonistas <i class="bi bi-caret-down-fill"></i></span></a>
            <div class="sub-menu collapse" id="submenu-protagonistas">
                <a class="nav-link" href="protagonistas.html"><span class="icon"><i class="bi bi-eye"></i></span><span class="description">Ver protagonistas</span></a>
                <a class="nav-link" href="alta_protagonista.html"><span class="icon"><i class="bi bi-person-plus"></i></span><span class="description">Agregar protagonista</span></a>
            </div>

            <a class="nav-link active" href="#" data-bs-toggle="collapse" data-bs-target="#submenu-ramas"><span class="icon"><i class="bi bi-diagram-3"></i></span><span class="description">Ramas <i class="bi bi-caret-down-fill"></i></span></a>
            <div class="sub-menu collapse show" id="submenu-ramas">
                <a class="nav-link" href="ramas.html"><span class="icon"><i class="bi bi-eye"></i></span><span class="description">Ver ramas</span></a>
                <a class="nav-link active" href="alta_rama.html"><span class="icon"><i class="bi bi-plus-circle"></i></span><span class="description">Agregar rama</span></a>
            </div>

            <a class="nav-link" href="#" data-bs-toggle="collapse" data-bs-target="#submenu-patrullas"><span class="icon"><i class="bi bi-shield-shaded"></i></span><span class="description">Patrullas <i class="bi bi-caret-down-fill"></i></span></a>
            <div class="sub-menu collapse" id="submenu-patrullas">
                <a class="nav-link" href="patrullas.html"><span class="icon"><i class="bi bi-eye"></i></span><span class="description">Ver patrullas</span></a>
                <a class="nav-link" href="alta_patrulla.html"><span class="icon"><i class="bi bi-plus-circle"></i></span><span class="description">Agregar patrulla</span></a>
            </div>
            
            <a href="gestionar_avisos.html" class="nav-link"><span class="icon"><i class="bi bi-megaphone"></i></span><span class="description">Avisos</span></a>
        </nav>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content-wrapper">
        <div class="container contenedor-principal my-4 p-4">
            <div class="barra-superior-inst mb-4">
                <h1 class="fw-bold mb-1">Nueva rama</h1>
                <p class="mb-0">Cargá una rama para luego asociarla a protagonistas y patrullas.</p>
            </div>
            
            <div id="alerta-contenedor"></div>

            <form id="form-alta-rama" class="tarjeta-blanca-borde p-4">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre de la rama</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Manada Seeonee, Unidad Scout..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Grupo</label>
                    <select id="id_grupo" name="id_grupo" class="form-select" required>
                        <option value="">Cargando grupos...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Categoría de rama</label>
                    <select id="id_categoria_rama" name="id_categoria_rama" class="form-select" required>
                        <option value="">Cargando categorías...</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="boton-primario px-4 py-2 fw-bold">
                        <i class="bi bi-save me-2"></i>Guardar rama
                    </button>
                    <a href="ramas.html" class="btn btn-secondary px-4 py-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- BARRA INFERIOR -->
    <div class="footer-inst">
        <p class="m-0 texto-blanco small">© 2026 Plataforma Educarama - Scouts de Argentina</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
