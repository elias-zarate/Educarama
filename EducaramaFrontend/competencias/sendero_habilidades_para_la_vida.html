<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sendero: Habilidades para la vida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="p-4 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- TARJETA DE COMPETENCIA: HABILIDADES -->
                <div class="tarjeta-competencia sendero-habilidades">
                    <div class="competencia-header">
                        <i class="bi bi-tools icono-sendero"></i>
                        <h3>Habilidades para la vida</h3>
                    </div>
                    <div class="competencia-subheader">
                        34. Me enfrento a desafíos y problemas y encuentro soluciones creativas para resolverlos.
                    </div>
                    <div class="competencia-body">
                        <div class="titulo-acciones border-bottom border-secondary border-opacity-25">
                            Acciones Requeridas
                        </div>
                        <ol class="lista-acciones">
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_1">
                                    <span>Propongo realizar junto a mi Manada Cacerías que planteen soluciones creativas a problemas simples y cotidianos de manera ecológica y sustentable.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_2">
                                    <span>Conozco y utilizo claves, códigos simples y sencillos para comunicarme con mis amigas y amigos de la Manada.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_3">
                                    <span>Sigo señales de pista en un sendero de 1 km.</span>
                                </label>
                            </li>
                        </ol>

                        <div class="titulo-acciones border-bottom border-secondary border-opacity-25">
                            Acciones Opcionales
                        </div>
                        <ol class="lista-acciones" start="4">
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_4">
                                    <span>Colaboro con el mantenimiento de los materiales de juego y del lugar donde realizamos actividades.</span>
                                </label>
                            </li>
                        </ol>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
