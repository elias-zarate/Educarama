<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sendero: Salud y bienestar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="p-4 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- TARJETA DE COMPETENCIA: SALUD Y BIENESTAR -->
                <div class="tarjeta-competencia sendero-salud">
                    <!-- Header -->
                    <div class="competencia-header">
                        <i class="bi bi-heart-pulse-fill icono-sendero"></i>
                        <h3>Salud y bienestar</h3>
                    </div>
                    <!-- Subheader -->
                    <div class="competencia-subheader">
                        7. Cuido mi privacidad e intimidad y respeto la de las demás personas.
                    </div>
                    <!-- Body -->
                    <div class="competencia-body">
                        <!-- Acciones Requeridas -->
                        <div class="titulo-acciones border-bottom border-secondary border-opacity-25">
                            Acciones Requeridas
                        </div>
                        <ol class="lista-acciones">
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_1">
                                    <span>Identifico situaciones en las que puedo sentirme incómodo o invadido.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_2">
                                    <span>Se decir NO ante una situación incómoda y cosas que no me gustan.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_3">
                                    <span>Ejerzo mi derecho a establecer límites personales y que estos límites deben ser respetados por los demás.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_4">
                                    <span>Entiendo que hay zonas íntimas de mi cuerpo y que hay espacios privados, como el baño, donde se resguarda mi intimidad.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_5">
                                    <span>Sé que NADIE puede obligarme a guardar secretos de situaciones que me incomodan, me confundan o me hagan sentir mal.</span>
                                </label>
                            </li>
                        </ol>

                        <!-- Acciones Opcionales -->
                        <div class="titulo-acciones border-bottom border-secondary border-opacity-25">
                            Acciones Opcionales
                        </div>
                        <ol class="lista-acciones" start="6">
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_6">
                                    <span>Sé cómo mantener mi información personal segura en entornos digitales.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_7">
                                    <span>Sé que puedo pedir ayuda ante situaciones que vulneran mi intimidad o seguridad y la de mis amigas y amigos.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_8">
                                    <span>Pido permiso antes de tocar a alguien, compartir información personal u objetos que no me pertenecen.</span>
                                </label>
                            </li>
                        </ol>
                    </div>
                </div>
                <!-- FIN TARJETA -->

            </div>
        </div>
    </div>
</body>
</html>
