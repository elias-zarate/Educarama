<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sendero: Ambiente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="p-4 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- TARJETA DE COMPETENCIA: AMBIENTE -->
                <div class="tarjeta-competencia sendero-ambiente">
                    <div class="competencia-header">
                        <i class="bi bi-tree-fill icono-sendero"></i>
                        <h3>Ambiente</h3>
                    </div>
                    <div class="competencia-subheader">
                        28. Entiendo que mis acciones tienen un impacto en el Planeta Tierra y me comprometo a su cuidado.
                    </div>
                    <div class="competencia-body">
                        <div class="titulo-acciones border-bottom border-secondary border-opacity-25">
                            Acciones Requeridas
                        </div>
                        <ol class="lista-acciones">
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_1">
                                    <span>Realizo actividades en la naturaleza tratando de hacer el mínimo impacto, para eso aplico los principios de "No dejar rastros".</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_2">
                                    <span>Aprendo sobre abonos y fertilizantes naturales y los utilizo para mis plantas, huerta, macetas, etc.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_3">
                                    <span>Cuido el agua potable evitando malgastarla o mal utilizarla.</span>
                                </label>
                            </li>
                        </ol>

                        <div class="titulo-acciones border-bottom border-secondary border-opacity-25">
                            Acciones Opcionales
                        </div>
                        <ol class="lista-acciones" start="4">
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_4">
                                    <span>Identifico los materiales que causan un impacto negativo en la naturaleza y evito su uso.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_5">
                                    <span>Apago las luces y los dispositivos electrónicos cuando no los estoy usando.</span>
                                </label>
                            </li>
                        </ol>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
