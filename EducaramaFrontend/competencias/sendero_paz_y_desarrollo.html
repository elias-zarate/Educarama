<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sendero: Paz y desarrollo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="p-4 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- TARJETA DE COMPETENCIA: PAZ Y DESARROLLO -->
                <div class="tarjeta-competencia sendero-paz">
                    <div class="competencia-header">
                        <i class="bi bi-peace icono-sendero"></i>
                        <h3>Paz y desarrollo</h3>
                    </div>
                    <div class="competencia-subheader">
                        12. Me intereso por la cultura de mi comunidad y mi país.
                    </div>
                    <div class="competencia-body">
                        <div class="titulo-acciones border-bottom border-secondary border-opacity-25">
                            Acciones Requeridas
                        </div>
                        <ol class="lista-acciones">
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_1">
                                    <span>Investigo leyendas, música y danzas de mi región y mi país y comparto lo que más me gusta en una Flor Roja de la Manada.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_2">
                                    <span>Participo junto a mi familia o con la Manada de visitas a museos, monumentos históricos o sitios culturales para aprender sobre la historia y la cultura de mi comunidad o país.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_3">
                                    <span>Aprendo a cocinar un plato típico de mi región o país.</span>
                                </label>
                            </li>
                        </ol>

                        <div class="titulo-acciones border-bottom border-secondary border-opacity-25">
                            Acciones Opcionales
                        </div>
                        <ol class="lista-acciones" start="4">
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_4">
                                    <span>Participo junto a mi Manada o con mi familia de festividades típicas de la región donde vivo.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_5">
                                    <span>Investigo y realizo un juego tradicional de mi región o de mi país con mi Manada.</span>
                                </label>
                            </li>
                            <li>
                                <label class="accion-item-wrapper">
                                    <input type="checkbox" name="accion_6">
                                    <span>Desarrollo una especialidad relacionada con la cultura.</span>
                                </label>
                            </li>
                        </ol>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
